<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e8">
  <title>Melt Melon</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#f5f2e8;color:#244638}
    .boot{display:grid;gap:10px;justify-items:center;padding:32px;text-align:center}.boot__dot{width:28px;height:28px;border:3px solid #d3d9c8;border-top-color:#426b47;border-radius:50%;animation:spin .8s linear infinite}.boot p{margin:0;font-size:14px}.boot a{color:#426b47}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.boot__dot{animation:none}}
  </style>
  <script defer src="./src/bootstrap.js"></script>
</head>
<body>
  <main class="boot" id="boot-status" role="status" aria-live="polite">
    <span class="boot__dot" aria-hidden="true"></span>
    <p>Loading Melt Melon…</p>
    <noscript><p>JavaScript is required for the localized launcher. <a href="./game.html">Open the original game</a>.</p></noscript>
  </main>
</body>
</html>
