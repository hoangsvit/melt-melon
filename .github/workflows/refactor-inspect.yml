name: Apply Refactor

on:
  push:
    branches:
      - refactor/maintainable-i18n
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract maintainable sources
        run: python3 tools/refactor_monolith.py
      - name: Validate extracted JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          test -s assets/fruit-atlas.png
          ! grep -q 'data:image/png;base64' index.html
          ! grep -q '<style' index.html
      - name: Commit generated refactor
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src assets
          git commit -m 'refactor: extract game sources and assets'
          git push origin HEAD:refactor/maintainable-i18n
