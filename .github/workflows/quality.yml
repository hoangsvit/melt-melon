name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate static architecture and translations
        run: python3 scripts/validate_static.py
      - name: Check JavaScript syntax
        shell: bash
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Smoke test browser startup and locale override
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python3 -m http.server 4173 --bind 127.0.0.1 >"$tmpdir/server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1

          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$tmpdir/chrome" \
            --lang=zh-CN \
            --virtual-time-budget=5000 \
            --dump-dom \
            'http://127.0.0.1:4173/?lang=en&seed=0' \
            >"$tmpdir/dom.html" 2>"$tmpdir/chrome.log"

          grep -q '<html lang="en"' "$tmpdir/dom.html"
          grep -q 'id="language-select"' "$tmpdir/dom.html"
          grep -q 'Move left/right · Release the first fruit' "$tmpdir/dom.html"
          grep -q 'Two Blueberry merge into Grape' "$tmpdir/dom.html"
