name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate static architecture and translations
        run: python3 scripts/validate_static.py
      - name: Check JavaScript syntax
        shell: bash
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Smoke test browser startup, locale, difficulty, and stages
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python3 -m http.server 4173 --bind 127.0.0.1 >"$tmpdir/server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..50}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1

          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$tmpdir/chrome" \
            --lang=zh-CN \
            --virtual-time-budget=5000 \
            --dump-dom \
            'http://127.0.0.1:4173/?lang=en&seed=0' \
            >"$tmpdir/dom.html" 2>"$tmpdir/chrome.log"

          grep -q '<html lang="en"' "$tmpdir/dom.html"
          grep -q 'id="language-select"' "$tmpdir/dom.html"
          grep -q 'Move left/right · Release your first fruit' "$tmpdir/dom.html"
          grep -q 'Two Blueberry merge into Grape' "$tmpdir/dom.html"
          grep -q 'data-difficulty="normal" class="difficulty-option" aria-pressed="true"' "$tmpdir/dom.html"
          grep -q 'id="stage-control"' "$tmpdir/dom.html"
          grep -q '>Endless</button>' "$tmpdir/dom.html"

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$tmpdir/chrome-hard" \
            --lang=zh-CN \
            --virtual-time-budget=5000 \
            --dump-dom \
            'http://127.0.0.1:4173/?lang=en&seed=0&difficulty=hard' \
            >"$tmpdir/hard.html" 2>"$tmpdir/chrome-hard.log"

          grep -q 'data-difficulty="hard"' "$tmpdir/hard.html"
          grep -q 'data-difficulty="hard" class="difficulty-option" aria-pressed="true"' "$tmpdir/hard.html"
          grep -q '>Expert</button>' "$tmpdir/hard.html"
          grep -q 'Less room &amp; energy · 2.1s danger timer' "$tmpdir/hard.html"
          grep -q 'Soften lasts 2.4s and costs 72 energy' "$tmpdir/hard.html"
          grep -q 'red line for 2.1s' "$tmpdir/hard.html"
          grep -q '<strong id="energy-value">45</strong>' "$tmpdir/hard.html"
          grep -q '14/sec' "$tmpdir/hard.html"

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="$tmpdir/chrome-stage" \
            --lang=zh-CN \
            --virtual-time-budget=5000 \
            --dump-dom \
            'http://127.0.0.1:4173/?lang=en&seed=0&mode=stage&stage=1' \
            >"$tmpdir/stage.html" 2>"$tmpdir/chrome-stage.log"

          grep -q 'data-game-mode="stage"' "$tmpdir/stage.html"
          grep -q 'data-stage="1"' "$tmpdir/stage.html"
          grep -q 'Level 1 / 20' "$tmpdir/stage.html"
          grep -q 'Make 2 merges' "$tmpdir/stage.html"
          grep -q '8 drops left' "$tmpdir/stage.html"
          grep -q '🔒 Level 2' "$tmpdir/stage.html"
          grep -q '★ 0 / 60' "$tmpdir/stage.html"
          grep -q '☆☆☆' "$tmpdir/stage.html"
          grep -q '3★ ≤ 6 drops · 2★ ≤ 7 drops' "$tmpdir/stage.html"
